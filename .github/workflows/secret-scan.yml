name: Secret exposure prevention
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject literal database passwords
        run: python3 scripts/check-secrets.py
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          mkdir -p /tmp/jetrelay-gitleaks
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/jetrelay-gitleaks gitleaks
      - name: Scan complete available Git history with redacted output
        run: /tmp/jetrelay-gitleaks/gitleaks git . --log-opts=--all --redact=100 --no-banner
